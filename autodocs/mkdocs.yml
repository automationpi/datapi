site_name: 'AI Generated Documentation'
site_description: 'Comprehensive documentation generated by AI'

nav:
  - 'Overview': 'index.md'
  - 'Architecture': 'architecture.md'
  
theme:
  name: 'material'

plugins:
  - techdocs-core

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
